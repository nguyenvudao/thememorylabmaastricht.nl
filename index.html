<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>thememorylabmaastricht.nl is for sale</title>
  <style>
    :root {
      --bg: #fbf6ee;
      --ink: #2b211b;
      --muted: #7a6a5d;
      --accent: #c8102e;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 20px;
      padding: 48px 28px;
      box-shadow: 0 20px 50px rgba(43, 33, 27, 0.12);
    }
    .tag {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin-top: 20px;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      word-break: break-word;
    }
    .sub { margin-top: 8px; color: var(--muted); font-size: 1.1rem; }
    .bowl { margin-top: 32px; font-size: 4rem; }
    .price { margin-top: 8px; font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 800; }
    .price span { color: var(--accent); }
    .where { margin-top: 6px; color: var(--muted); }
    .dutch {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed #e4d8c8;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .dutch strong { color: var(--accent); }
    .cta {
      display: inline-block;
      margin-top: 36px;
      padding: 16px 36px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .cta:hover { background: var(--accent); transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <span class="tag">For sale</span>
    <h1>thememorylabmaastricht.nl</h1>
    <p class="sub">This domain is for sale</p>
    <div class="bowl" aria-hidden="true">🍜</div>
    <p class="price">Price: <span>100</span> bowls of pho</p>
    <p class="where">at Nga Ngo restaurant</p>
    <div class="dutch" lang="nl">
      <p>Dit domein is te koop</p>
      <p>Prijs: <strong>100</strong> kommen pho bij restaurant Nga Ngo</p>
    </div>
    <a class="cta" href="https://thememorylabmaastricht.com">Click here · Klik hier</a>
  </main>
</body>
</html>
